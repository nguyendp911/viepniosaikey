name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build without signing for simulator
        run: |
          xcodebuild -project ViePNAIKeyboard.xcodeproj -scheme ViePNAIKeyboard -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  ipa:
    runs-on: macos-15
    environment: ios-signing
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_KEYBOARD_BASE64: ${{ secrets.IOS_PROFILE_KEYBOARD_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$PROFILE_APP_BASE64" && test -n "$PROFILE_KEYBOARD_BASE64"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p temp-password "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temp-password "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp-password "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_KEYBOARD_BASE64" | base64 --decode > "$RUNNER_TEMP/keyboard.mobileprovision"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          cp "$RUNNER_TEMP/keyboard.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/keyboard.mobileprovision"
      - name: Archive and export
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          APP_PROFILE_NAME: ${{ secrets.IOS_APP_PROFILE_NAME }}
          KEYBOARD_PROFILE_NAME: ${{ secrets.IOS_KEYBOARD_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_TEAM" && test -n "$APP_PROFILE_NAME" && test -n "$KEYBOARD_PROFILE_NAME"
          xcodebuild -project ViePNAIKeyboard.xcodeproj -scheme ViePNAIKeyboard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ViePN.xcarchive" DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Manual "APP_PROFILE_NAME=$APP_PROFILE_NAME" "KEYBOARD_PROFILE_NAME=$KEYBOARD_PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>provisioningProfiles</key><dict>
          <key>com.viepn.aikey</key><string>$APP_PROFILE_NAME</string>
          <key>com.viepn.aikey.keyboard</key><string>$KEYBOARD_PROFILE_NAME</string>
          </dict></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ViePN.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/export/"*.ipa artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ViePN-AI-Keyboard-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

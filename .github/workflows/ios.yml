name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Compile and package unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Vietnamese conversation context
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -o "$RUNNER_TEMP/verify-context" \
            Sources/Shared/KeyboardSettings.swift \
            Sources/Shared/CoupleStyleCatalog.swift \
            Sources/Shared/CoupleReplyGuide.swift \
            Sources/Shared/ConversationContext.swift \
            Sources/Shared/ReplyEngine.swift \
            Scripts/verify_conversation_context.swift
          "$RUNNER_TEMP/verify-context"
      - name: Verify Vietnamese Telex input
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -o "$RUNNER_TEMP/verify-telex" \
            Sources/Shared/VietnameseTelex.swift Scripts/verify_telex.swift
          "$RUNNER_TEMP/verify-telex"
      - name: Install XcodeGen
        run: brew install xcodegen librsvg
      - name: Prepare ViePN AI Keyboard logo
        run: sh scripts/prepare-app-icon.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate and build device app without signing
        run: |
          set -euo pipefail
          xcodebuild -project ViePNAIKeyboard.xcodeproj \
            -scheme ViePNAIKeyboard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for later signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ViePNAIKeyboard.app"
          test -d "$APP"
          test -s "$APP/Assets.car"
          # Detect iOS legacy letterboxing before publishing an IPA.
          if ! /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP/Info.plist" >/dev/null 2>&1 && \
             ! /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::App Info.plist has no launch screen; iPhone may show black top/bottom bands."
            exit 1
          fi
          echo "Modern iPhone launch screen configuration verified."
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" | grep -Fx 'AppIcon'
          EXT="$APP/PlugIns/ViePNKeyboardExtension.appex"
          test -d "$EXT"
          echo "Checking embedded keyboard extension..."
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist" | grep -F 'KeyboardViewController'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist" | grep -Fx 'com.viepn.aikey.keyboard'
          test -f "$EXT/ViePNKeyboardExtension"
          echo "Keyboard extension bundle verified."
          mkdir -p "$RUNNER_TEMP/Unsigned/Payload" artifacts
          cp -R "$APP" "$RUNNER_TEMP/Unsigned/Payload/"
          cd "$RUNNER_TEMP/Unsigned"
          zip -qry "$GITHUB_WORKSPACE/artifacts/ViePN-AI-Keyboard-unsigned.ipa" Payload
      - name: Upload unsigned IPA (requires signing before installing)
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-AI-Keyboard-Unsigned-IPA
          path: artifacts/ViePN-AI-Keyboard-unsigned.ipa
          if-no-files-found: error
  ipa:
    name: Signed ad-hoc IPA
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15
    environment: ios-signing
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen librsvg
      - run: sh scripts/prepare-app-icon.sh
      - run: xcodegen generate
      - name: Validate signing secrets
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_KEYBOARD_BASE64: ${{ secrets.IOS_PROFILE_KEYBOARD_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          APP_PROFILE_NAME: ${{ secrets.IOS_APP_PROFILE_NAME }}
          KEYBOARD_PROFILE_NAME: ${{ secrets.IOS_KEYBOARD_PROFILE_NAME }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD PROFILE_APP_BASE64 PROFILE_KEYBOARD_BASE64 DEVELOPMENT_TEAM APP_PROFILE_NAME KEYBOARD_PROFILE_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing signing secret::$name is not set in ios-signing environment or repository secrets."
              exit 1
            fi
          done
      - name: Install signing credentials
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_KEYBOARD_BASE64: ${{ secrets.IOS_PROFILE_KEYBOARD_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p temp-password "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temp-password "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp-password "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_KEYBOARD_BASE64" | base64 --decode > "$RUNNER_TEMP/keyboard.mobileprovision"
          for kind in app keyboard; do
            security cms -D -i "$RUNNER_TEMP/$kind.mobileprovision" > "$RUNNER_TEMP/$kind.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/$kind.plist")
            cp "$RUNNER_TEMP/$kind.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done
      - name: Archive and export signed IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          APP_PROFILE_NAME: ${{ secrets.IOS_APP_PROFILE_NAME }}
          KEYBOARD_PROFILE_NAME: ${{ secrets.IOS_KEYBOARD_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild -project ViePNAIKeyboard.xcodeproj \
            -scheme ViePNAIKeyboard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ViePN.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Manual \
            "APP_PROFILE_NAME=$APP_PROFILE_NAME" "KEYBOARD_PROFILE_NAME=$KEYBOARD_PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>provisioningProfiles</key><dict>
          <key>com.viepn.aikey</key><string>$APP_PROFILE_NAME</string>
          <key>com.viepn.aikey.keyboard</key><string>$KEYBOARD_PROFILE_NAME</string>
          </dict></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ViePN.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/export/"*.ipa artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ViePN-AI-Keyboard-Signed-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

name: ViePNAIKeyboard
options:
  bundleIdPrefix: com.viepn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ViePNAIKeyboard:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.aikey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ViePN AI Keyboard
        GENERATE_INFOPLIST_FILE: YES
        # Modern iPhone viewport needs a launch screen; without one iOS can
        # letterbox the app into a legacy-sized area with black top/bottom bands.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "ViePN sử dụng Face ID để mở khóa lịch sử hội thoại do bạn lưu."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ViePN thu âm khi bạn bấm ghi âm để chuyển giọng nói thành văn bản."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ViePN nhận dạng giọng nói khi bạn chọn chức năng nói thành văn bản."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "ViePN thêm lịch hẹn khi bạn xác nhận trong ứng dụng."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "ViePN chỉ ghi sự kiện lịch hẹn mà bạn xác nhận."
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
    dependencies:
      - target: ViePNKeyboardExtension
        embed: true
      - target: ViePNShareExtension
        embed: true
  ViePNKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Keyboard
      - path: Sources/Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.aikey.keyboard
        INFOPLIST_FILE: Config/KeyboardInfo.plist
        CODE_SIGN_ENTITLEMENTS: Config/Keyboard.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(KEYBOARD_PROFILE_NAME)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ViePNShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Share
      - path: Sources/Shared/ShareDraft.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.aikey.share
        INFOPLIST_FILE: Config/ShareInfo.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(SHARE_PROFILE_NAME)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ViePNKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/KeyboardUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.aikey.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ViePNAIKeyboard
schemes:
  ViePNAIKeyboard:
    build:
      targets:
        ViePNAIKeyboard: all
  ViePNKeyboardSmoke:
    build:
      targets:
        ViePNAIKeyboard: all
        ViePNKeyboardUITests: [test]
    test:
      targets:
        - ViePNKeyboardUITests
